<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <title>Contacto</title>
  </head>
  <body>
    <header>
      <div class="banner">
        <p>Estudiar en Trilce — ¡Tu futuro empieza aquí!</p>
      </div>
      <nav>
        <div class="logo-header">
          <a href="index.html">
            <img src="img/logo_colegio_trilce_46.svg" alt="logo" />
          </a>
        </div>
        <div>
          <ul class="list-nav">
            <li><a href="oferta-educativa.html">Oferta educativa</a></li>
            <li><a href="nosotros.html">Nosotros</a></li>
            <li><a href="noticias.html">Noticias</a></li>
            <li><a href="contacto.html">Contacto</a></li>
          </ul>
        </div>
        <div class="boton-matricula">
          <a href="#">Matricúlate</a>
        </div>
      </nav>
    </header>
    <main>

      <section id="hero-contacto">
        <div class="contenido-hero-contacto">
          <h1>Contáctanos</h1>
          <p>Estamos aquí para ayudarte. Escríbenos, llámanos o visítanos.</p>
        </div>
      </section>

      <!-- FORMULARIO + INFO -->
      <section id="contacto">
        <div class="contacto-formulario">
          <h2>Envíanos un mensaje</h2>
          <div class="acento-naranja"></div>
          <form>
            <div class="form-fila">
              <input type="text" placeholder="Nombre">
              <input type="text" placeholder="Apellido">
            </div>
            <input type="email" placeholder="Correo electrónico">
            <input type="text" placeholder="Teléfono / WhatsApp">
            <select>
              <option>Información de matrícula</option>
              <option>Consulta sobre cursos</option>
              <option>Información de pensiones</option>
              <option>Otro</option>
            </select>
            <textarea placeholder="Escribe tu mensaje aquí..."></textarea>
            <button type="submit">Enviar mensaje →</button>
          </form>
        </div>
      </section>

    </main>
    <footer>
      <div class="logo-footer">
        <img src="img/logo_colegio_trilce_46.svg" alt="logo-footer" />
      </div>
      <div class="footer-content">
        <p>© 2026 — Trilce. Todos los derechos reservados.</p>
      </div>
    </footer>
  </body>
</html>
